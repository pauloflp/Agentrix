name: Publish catalog releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-releases.yml'
      - 'docs/release-notes/**'
      - 'scripts/publish-catalog-releases.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentrix-catalog-releases
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check and publish catalog releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-catalog-releases.sh
