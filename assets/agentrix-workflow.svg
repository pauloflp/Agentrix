<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="208" viewBox="0 0 1050 208" role="img" aria-labelledby="title desc"><title id="title">Agentrix workflow</title><desc id="desc">Four steps: choose a tool, run locally, inspect findings, ship with confidence.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091425"/><stop offset="1" stop-color="#0D203B"/></linearGradient></defs><rect width="1050" height="208" rx="17" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="30" y="37" fill="#8DAFD3" font-size="13" letter-spacing="2">THE WORKFLOW</text><g fill="#112947" stroke="#4273AA"><rect x="30" y="60" width="223" height="115" rx="13"/><rect x="285" y="60" width="223" height="115" rx="13"/><rect x="540" y="60" width="223" height="115" rx="13"/><rect x="795" y="60" width="223" height="115" rx="13"/></g><g fill="#6EBAFF" font-size="14" font-weight="700"><text x="50" y="88">01 / DISCOVER</text><text x="305" y="88">02 / RUN</text><text x="560" y="88">03 / REVIEW</text><text x="815" y="88">04 / SHIP</text></g><g fill="#EDF5FF" font-size="18" font-weight="700"><text x="50" y="120">Choose a tool</text><text x="305" y="120">Work locally</text><text x="560" y="120">Inspect results</text><text x="815" y="120">Make it better</text></g><g fill="#9DB6D4" font-size="13"><text x="50" y="145">Find the right workflow</text><text x="305" y="145">Simple commands</text><text x="560" y="145">Clear findings</text><text x="815" y="145">Validate before release</text></g></g></svg>